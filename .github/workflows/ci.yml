name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job that needs the test database declares the URL literally in its own
# `env` block. The `env` context is not available in `jobs.<job_id>.env`, so a
# workflow-level `env` cannot be referenced there. The name must end in `_test`;
# conftest.py refuses to run its destructive fixtures against any other database.
jobs:
  # Fast, database-free checks. Fail here before paying for a database or a
  # browser build.
  quality:
    name: Lint and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Python workspace
        run: uv sync --locked --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (ingest core)
        run: uv run mypy

      - name: Markdown links
        run: uv run python scripts/check_markdown_links.py

  # The declared support range is 3.12-3.14. Test the floor and the ceiling.
  # `--require-integration` makes a dead database service a failure, not a
  # green build full of skips.
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: philfacilities
          POSTGRES_PASSWORD: philfacilities
          POSTGRES_DB: philfacilities_test
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U philfacilities -d philfacilities_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PHILFACILITIES_TEST_DATABASE_URL: postgresql+psycopg://philfacilities:philfacilities@localhost:54330/philfacilities_test
      DATABASE_URL: postgresql+psycopg://philfacilities:philfacilities@localhost:54330/philfacilities_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python workspace
        run: uv sync --locked --all-packages

      # Coverage over the integration suite is unreliable with the 3.14
      # C-extension combination, so 3.12 runs once with coverage and 3.14
      # runs once without. Both legs require integration tests to run.
      - name: Full suite with coverage floor (Python 3.12)
        if: matrix.python-version == '3.12'
        run: uv run pytest --require-integration -q --cov --cov-fail-under=60

      - name: Full suite (Python 3.14)
        if: matrix.python-version != '3.12'
        run: uv run pytest --require-integration

  web:
    name: Web lint, typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Generated client matches the committed OpenAPI contract
        run: |
          pnpm typegen
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.ts

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Next.js production build
        run: pnpm build

  # Runs against the deterministic synthetic demo: CI cannot download the
  # restricted or bulk real sources. Fixture values are supplied by env so the
  # spec stays data-source agnostic.
  e2e:
    name: Playwright end-to-end and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: philfacilities
          POSTGRES_PASSWORD: philfacilities
          POSTGRES_DB: philfacilities_test
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U philfacilities -d philfacilities_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PHILFACILITIES_DATABASE_URL: postgresql+psycopg://philfacilities:philfacilities@localhost:54330/philfacilities_test
      DATABASE_URL: postgresql+psycopg://philfacilities:philfacilities@localhost:54330/philfacilities_test
      PHILFACILITIES_TEST_DATABASE_URL: postgresql+psycopg://philfacilities:philfacilities@localhost:54330/philfacilities_test
      API_BASE_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PHILFACILITIES_E2E_SCHOOL_SEARCH: Synthetic Demo School 01
      PHILFACILITIES_E2E_SCHOOL_NAME: Synthetic Demo School 01
      PHILFACILITIES_E2E_SCHOOL_SLUG: synthetic-demo-school-01
      PHILFACILITIES_E2E_PROVINCE_CODE: "9901000000"
      PHILFACILITIES_E2E_FILTER_SCHOOL_SEARCH: Synthetic Demo School 01
      PHILFACILITIES_E2E_FILTER_SCHOOL_NAME: Synthetic Demo School 01
      PHILFACILITIES_E2E_FILTER_PROVINCE_CODE: "9901000000"
      PHILFACILITIES_E2E_LOCATION_PRECISION: source_gps
      PHILFACILITIES_E2E_PRECISION_LABEL: Source GPS
      PHILFACILITIES_E2E_SOURCE_AGENCY: deped
      PHILFACILITIES_E2E_SOURCE_LABEL: SYNTHETIC-DEMO-SY2024-2025
      PHILFACILITIES_E2E_SOURCE_ATTRIBUTION: ""
      PHILFACILITIES_E2E_SOURCE_RECORD_KEY: SYN-DEPED-0001
      PHILFACILITIES_E2E_MAP_QUERY: Synthetic Demo School 01
      PHILFACILITIES_E2E_MAP_RESULT_NAME: Synthetic Demo School 01
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Python workspace
        run: uv sync --locked --all-packages

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Load synthetic demonstration data
        run: uv run philfacilities-ingest demo load --reset

      - name: Build web application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @philfacilities/web exec playwright install --with-deps chromium

      - name: Start API and web server
        run: |
          uv run uvicorn philfacilities_api.main:app --host 127.0.0.1 --port 8010 > /tmp/philfacilities-api.log 2>&1 &
          pnpm --filter @philfacilities/web start > /tmp/philfacilities-web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8010/healthz > /dev/null \
              && curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "API and web are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready in time."
          tail -100 /tmp/philfacilities-api.log || true
          tail -100 /tmp/philfacilities-web.log || true
          exit 1

      - name: Playwright functional and axe checks
        run: pnpm --filter @philfacilities/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  # Single required check for branch protection. Any failed or skipped
  # dependency fails this job, so a dead database service can never go green.
  ci-ok:
    name: CI passed
    if: always()
    needs: [quality, python-tests, web, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Required job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed: $result"
              exit 1
            fi
          done
