name: Deploy to Heroku

# GitHub main is the single source of truth for deployments. Vercel deploys
# through its Git integration; this workflow does the same for the API on
# Heroku. Do not deploy either service from a local checkout.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Heroku
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEROKU_APP: philfacilities-api
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secret
        run: |
          if [ -z "${HEROKU_API_KEY:-}" ]; then
            echo "HEROKU_API_KEY is not configured; skipping deploy."
            exit 1
          fi

      - name: Push main to Heroku
        # OAuth tokens contain characters that are unsafe in a git URL; let
        # git ask for credentials over a helper instead of embedding the token.
        run: |
          cat > /tmp/heroku-askpass.sh <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) echo heroku ;;
            *Password*) printf '%s\n' "$HEROKU_API_KEY" ;;
          esac
          SCRIPT
          chmod +x /tmp/heroku-askpass.sh
          GIT_ASKPASS=/tmp/heroku-askpass.sh git push https://git.heroku.com/${HEROKU_APP}.git HEAD:main
