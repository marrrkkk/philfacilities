name: philfacilities

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: philfacilities
      POSTGRES_PASSWORD: philfacilities
      POSTGRES_DB: philfacilities
    ports:
      - "${PHILFACILITIES_DB_PORT:-54329}:5432"
    volumes:
      - philfacilities-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philfacilities -d philfacilities"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-db:
    image: postgis/postgis:17-3.5
    profiles: ["test"]
    environment:
      POSTGRES_USER: philfacilities
      POSTGRES_PASSWORD: philfacilities
      POSTGRES_DB: philfacilities_test
    ports:
      - "${PHILFACILITIES_TEST_DB_PORT:-54330}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philfacilities -d philfacilities_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: philfacilities
      MINIO_ROOT_PASSWORD: philfacilities-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - philfacilities-minio:/data

volumes:
  philfacilities-db:
  philfacilities-minio:
