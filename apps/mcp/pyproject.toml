[project]
name = "philfacilities-mcp"
version = "0.1.0"
description = "Read-only MCP server for the PhilFacilities public API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "mcp>=2.3,<3",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
philfacilities-mcp = "philfacilities_mcp.__main__:main"
philfacilities-mcp-http = "philfacilities_mcp.http:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["philfacilities_mcp"]
