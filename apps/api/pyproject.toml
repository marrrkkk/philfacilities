[project]
name = "philfacilities-api"
version = "0.1.0"
description = "Public read API for PhilFacilities"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "geoalchemy2>=0.16",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyarrow>=19.0",
  "python-dateutil>=2.9",
  "scalar-fastapi>=1.10",
  "sqlalchemy>=2.1.0",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
philfacilities-api = "philfacilities_api.__main__:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["philfacilities_api"]
