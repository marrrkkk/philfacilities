[project]
name = "philfacilities-ingest"
version = "0.1.0"
description = "Source adapters and repeatable ETL for PhilFacilities"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "philfacilities-api",
  "polars>=1.20",
  "pypdfium2>=4.30",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
  "rapidocr-onnxruntime>=1.3",
  "sqlalchemy>=2.0.36",
  "typer>=0.15",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "reportlab>=4.2",
]

[project.scripts]
philfacilities-ingest = "philfacilities_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["philfacilities_ingest"]
